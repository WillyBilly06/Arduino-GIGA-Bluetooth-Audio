name=GigaBredr
version=0.2.4
author=Ngoc Viet Ho
maintainer=Ngoc Viet Ho
sentence=Bluetooth A2DP receiver with I2S output, BLE GATT server and Classic profiles for the Arduino GIGA R1 WiFi.
paragraph=Owned host stack on the Murata 1DX radio. Decoders: SBC/SBC-XQ, AAC, aptX, aptX HD, LDAC, LHDC V5, Opus, Samsung SSC; pick which are compiled in with GIGA_BREDR_CODECS(...), and only the active codec allocates memory. Also AVRCP, SPP, HID, OBEX (OPP/PBAP/MAP), experimental HFP/HSP, persistent QSPI bonding and fast reconnects. Experimental; see README and THIRD_PARTY.
